# Loki yazi main config — part of ~/.loki-term
# Minimal & portable: theme lives in theme.toml.

[mgr]
ratio          = [1, 3, 4]   # parent | current | preview
sort_by        = "natural"
sort_sensitive = false
sort_dir_first = true
show_hidden    = false       # toggle in-app with `.`
show_symlink   = true
linemode       = "size"
scrolloff      = 5

[preview]
tab_size      = 2
max_width     = 1000
max_height    = 1000
image_quality = 90
